  <line x1="45" y1="28" x2="75" y2="28" stroke="url(#cool)" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="49" y1="39" x2="71" y2="39" stroke="url(#warm)" stroke-width="3.1" stroke-linecap="round"/>
  <line x1="56" y1="50" x2="64" y2="50" stroke="url(#cool)" stroke-width="3.1" stroke-linecap="round"/>

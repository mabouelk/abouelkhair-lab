<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Abouelkhair Laboratory Mark</title>
  <desc id="desc">Standalone DNA helix mark from the Abouelkhair Laboratory brand.</desc>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fbfe"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="helixA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ac8ff"/>
      <stop offset="100%" stop-color="#1c56d3"/>
    </linearGradient>
    <linearGradient id="helixB" x1="100%" y1="0%" x2="0%" y2="100%">
